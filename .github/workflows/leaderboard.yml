name: Public leaderboard
on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: '재검사할 공개 제출 이슈 번호. 비우면 게시 없는 운영 점검'
        required: false
        type: string
permissions: {}
concurrency:
  group: leaderboard-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[Leaderboard]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: read
    outputs:
      publishable: ${{ steps.grade.outputs.publishable }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node bin/run-tests.js install --with-deps chromium
      - id: grade
        run: node bin/leaderboard-grade.js
        env:
          GH_TOKEN: ${{ github.token }}
          PLAYWRIGHT_BROWSERS_PATH: '0'
      - uses: actions/upload-artifact@v4
        with:
          name: verified-leaderboard-result
          path: test-results/leaderboard-verified.json
          retention-days: 7
  publish:
    needs: verify
    if: needs.verify.outputs.publishable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: verified-leaderboard-result
          path: test-results
      - run: node bin/leaderboard-publish.js
        env:
          GH_TOKEN: ${{ github.token }}
